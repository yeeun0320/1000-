<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>상품 이미지 변환기</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#202631;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e2e5ea;padding:22px 30px}h1{font-size:23px;margin:0}header p{color:#667085;margin:7px 0 0}.layout{max-width:1450px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:280px minmax(300px,1fr) 320px;gap:16px}.panel{background:white;border:1px solid #e3e6ed;border-radius:14px;padding:20px;min-width:0}h2{font-size:16px;margin:0 0 17px}h3{font-size:14px;margin:20px 0 9px}.drop{border:2px dashed #b9c4d3;border-radius:12px;padding:30px 10px;text-align:center;cursor:pointer;background:#fafcff}.drop.drag{border-color:#2563eb;background:#edf4ff}.hint{font-size:12px;color:#667085}button,.btn{border:0;border-radius:8px;padding:11px 13px;background:#eef1f6;color:#202631;font-weight:600;cursor:pointer}button.primary{background:#225fe0;color:white;width:100%;margin-top:15px}button:disabled{opacity:.5;cursor:wait}.file{padding:10px 8px;border-bottom:1px solid #eee;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.file.active{background:#eaf1ff;border-radius:7px}.preview{background:#e8ebf0;min-height:410px;display:flex;align-items:center;justify-content:center;border-radius:10px}.preview img{max-width:100%;max-height:540px;object-fit:contain;box-shadow:0 3px 14px #0001}.empty{color:#667085}.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:13px}.field input[type=number],select{width:110px;padding:8px;border:1px solid #cbd2dc;border-radius:7px}.field input[type=range]{width:150px}.field label{flex:1}.field input[type=checkbox]{width:17px;height:17px}.radio{font-size:13px;display:block;margin:8px 0}.status{font-size:13px;color:#536174;margin-top:13px;line-height:1.6}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1}@media(max-width:1050px){.layout{grid-template-columns:1fr 1fr}.settings{grid-column:1/-1}}@media(max-width:650px){.layout{grid-template-columns:1fr}.settings{grid-column:auto}.preview{min-height:300px}}
</style></head><body><header><h1>상품 이미지 1000×1000 변환기</h1><p>이미지를 추가하고 크기, 여백, 위치를 조절한 뒤 한 번에 다운로드해.</p></header><main class="layout"><section class="panel"><h2>이미지 파일</h2><div class="drop" id="drop">이미지를 클릭하거나 여기로 끌어와<br><span class="hint">PNG, JPG, WEBP, BMP, TIFF, AVIF · 최대 100장</span></div><input id="files" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff,.avif,image/*" multiple hidden><div class="buttons"><button id="add">이미지 추가</button><button id="clear">전체 삭제</button></div><p class="hint" id="count">0개 등록됨</p><div id="fileList"></div></section><section class="panel"><h2>변환 미리보기</h2><div class="preview" id="preview"><span class="empty">이미지를 추가해줘.</span></div><p class="status" id="previewInfo">설정을 바꾸면 미리보기가 자동 갱신돼.</p><button id="refresh">미리보기 갱신</button></section><section class="panel settings"><h2>변환 설정</h2><form id="settings"><h3>캔버스</h3><div class="field"><label>결과 크기 (정사각형 px)</label><input name="canvas_size" type="number" min="100" max="5000" value="1000"></div><h3>배경</h3><div class="field"><label>원본 이미지 배경 제거</label><input name="remove_bg" type="checkbox" value="true"></div><p class="hint">배경 제거는 서버에 AI 모델 설치가 필요하며 첫 실행은 느릴 수 있어.</p><h3>상품 이미지 크기</h3><label class="radio"><input type="radio" name="image_size_mode" value="ratio" checked> 캔버스 대비 비율</label><div class="field"><input name="image_ratio" type="range" min="10" max="100" value="85"><span id="ratioValue">85%</span></div><label class="radio"><input type="radio" name="image_size_mode" value="pixels"> 최대 크기 직접 입력</label><div class="field"><label>최대 크기 (px)</label><input name="image_pixels" type="number" min="10" max="5000" value="850"></div><h3>여백</h3><label class="radio"><input type="radio" name="margin_mode" value="same" checked> 상하좌우 동일</label><div class="field"><label>여백 (px)</label><input name="margin_all" type="number" min="0" value="75"></div><label class="radio"><input type="radio" name="margin_mode" value="individual"> 각각 설정</label><div class="field"><label>상</label><input name="margin_top" type="number" min="0" value="75"></div><div class="field"><label>하</label><input name="margin_bottom" type="number" min="0" value="75"></div><div class="field"><label>좌</label><input name="margin_left" type="number" min="0" value="75"></div><div class="field"><label>우</label><input name="margin_right" type="number" min="0" value="75"></div><h3>위치 미세조정</h3><div class="field"><label>좌우 X (px)</label><input name="offset_x" type="number" value="0"></div><div class="field"><label>상하 Y (px)</label><input name="offset_y" type="number" value="0"></div><h3>저장</h3><div class="field"><label>형식</label><select name="output_format"><option>PNG</option><option>JPG</option></select></div><div class="field"><label>JPG 품질</label><input name="jpeg_quality" type="number" min="50" max="100" value="95"></div></form><button class="primary" id="convert">전체 이미지 변환 · ZIP 다운로드</button><p class="status" id="status">이미지를 추가해줘.</p></section></main><script>
let items=[],selected=0,seq=0,previewUrl=null;const $=id=>document.getElementById(id);const form=$('settings');function renderList(){$('count').textContent=`${items.length}개 등록됨`;$('fileList').replaceChildren();items.forEach((item,i)=>{const div=document.createElement('div');div.className='file'+(selected===i?' active':'');div.textContent=item.name;div.title=item.name;div.onclick=()=>{selected=i;renderList();refresh()};$('fileList').append(div)})}function addFiles(files){for(const f of files){if(items.length>=100)break;if(!/\.(png|jpe?g|webp|bmp|tiff?|avif)$/i.test(f.name))continue;items.push(f)}renderList();refresh()}function payload(preview){const fd=new FormData(form);fd.set('remove_bg',form.elements.remove_bg.checked?'true':'false');fd.set('preview',preview?'true':'false');(preview?[items[selected]]:items).filter(Boolean).forEach(f=>fd.append('files',f));return fd}let token=0;async function refresh(){const t=++token;if(!items.length){$('preview').innerHTML='<span class="empty">이미지를 추가해줘.</span>';return}const btn=$('refresh');btn.disabled=true;$('previewInfo').textContent='미리보기 처리 중...';try{const r=await fetch('/convert',{method:'POST',body:payload(true)});if(!r.ok){const e=await r.json();throw Error(e.error||'미리보기 실패')}const blob=await r.blob();if(t!==token)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);const img=document.createElement('img');img.src=previewUrl;$('preview').replaceChildren(img);$('previewInfo').textContent=items[selected].name+' · 변환 미리보기 완료'}catch(e){if(t===token)$('previewInfo').textContent=e.message}finally{btn.disabled=false}}let timer;form.addEventListener('input',()=>{ $('ratioValue').textContent=form.elements.image_ratio.value+'%';clearTimeout(timer);timer=setTimeout(refresh,550)});$('refresh').onclick=refresh;$('add').onclick=()=>$('files').click();$('drop').onclick=()=>$('files').click();$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('clear').onclick=()=>{items=[];selected=0;renderList();refresh()};$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');addFiles(e.dataTransfer.files)};$('convert').onclick=async()=>{if(!items.length){$('status').textContent='이미지를 먼저 추가해줘.';return}const btn=$('convert');btn.disabled=true;$('status').textContent=`${items.length}개 이미지 변환 중...`;try{const r=await fetch('/convert',{method:'POST',body:payload(false)});if(!r.ok){const e=await r.json();throw Error(e.error||'변환 실패')}const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='converted_images.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='변환 완료. ZIP 파일을 확인해줘.'}catch(e){$('status').textContent='오류: '+e.message}finally{btn.disabled=false}};
</script></body></html>
