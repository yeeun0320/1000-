<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 변환기 로그인</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font-family:system-ui,sans-serif;color:#222}.login{background:white;padding:38px;border-radius:14px;box-shadow:0 5px 25px #0001;width:min(340px,85vw)}h1{font-size:21px;margin:0 0 24px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;font-size:15px}input{border:1px solid #d5d8de}button{margin-top:12px;background:#20242c;color:white;border:0;cursor:pointer}.error{color:#b42318;font-size:14px}</style></head><body><form class="login" method="post"><h1>이미지 변환기</h1><input type="password" name="password" placeholder="비밀번호" aria-label="비밀번호" required autofocus><button type="submit">확인</button>{% if error %}<p class="error">{{ error }}</p>{% endif %}</form></body></html>
